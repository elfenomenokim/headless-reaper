name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows is omitted (both editions exit 2 as an unsupported backend);
        # live browser and WebKit reaping (docs/demo/orphan.py) are left out of CI.
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
        # ubuntu-latest (26.04) ships no 3.9 build; keep 3.9 on ubuntu-22.04.
        exclude:
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-22.04
            python: "3.9"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and test Rust edition
        run: |
          cargo build --release --locked --manifest-path rust/Cargo.toml
          cargo test --locked --manifest-path rust/Cargo.toml
      - name: Test Python edition
        run: |
          python -m compileall -q src
          PYTHONPATH=src python -m unittest discover -s tests
      - name: Check Python/Rust parity (empty scope)
        run: PYTHON=python bash rust/parity.sh --json --path /tmp/reaper-parity-empty
